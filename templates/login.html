<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Back to Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #FAF7F2; --cream-dark: #F0EBE1; --sand: #E8DECE;
      --terra: #C4714A; --terra-dark: #A55A35; --terra-light: #F0D6C8;
      --ink: #2C2118; --ink-soft: #5C4F42; --ink-muted: #9A8E83;
      --green: #5A7A5C; --green-light: #D6E8D6;
      --red-light: #F8DDD8; --red: #B84C3C;
      --radius: 12px; --radius-sm: 8px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; font-size: 15px; line-height: 1.6; }
    nav { background: var(--ink); padding: 0 2rem; display: flex; align-items: center; height: 56px; }
    .nav-brand { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--cream); text-decoration: none; }
    .nav-brand span { color: var(--terra); }
    .page { max-width: 420px; margin: 0 auto; padding: 5vh 1.5rem 4rem; }
    .auth-icon { width: 52px; height: 52px; background: var(--terra-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 22px; }
    .auth-title { font-family: 'Playfair Display', serif; font-size: 26px; text-align: center; margin-bottom: 0.4rem; }
    .auth-sub { font-size: 14px; color: var(--ink-muted); text-align: center; margin-bottom: 2rem; }
    .card { background: #fff; border: 1px solid var(--sand); border-radius: var(--radius); padding: 1.5rem; box-shadow: 0 2px 16px rgba(44,33,24,0.08); }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); margin-bottom: 5px; }
    input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--sand); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink); background: #fff; }
    input:focus { outline: none; border-color: var(--terra); box-shadow: 0 0 0 3px rgba(196,113,74,0.15); }
    .btn { width: 100%; padding: 11px; background: var(--terra); color: #fff; border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; }
    .btn:hover { background: var(--terra-dark); }
    .footer-txt { text-align: center; margin-top: 1.5rem; font-size: 13px; color: var(--ink-muted); }
    .footer-txt a { color: var(--terra); text-decoration: none; font-weight: 500; }
    .error { background: var(--red-light); color: var(--red); padding: 12px 16px; border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 1.25rem; font-weight: 500; }
    .quote { margin-top: 2rem; border-left: 3px solid var(--terra); background: var(--terra-light); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 1.25rem 1.5rem; }
    .quote p { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--terra-dark); font-style: italic; line-height: 1.6; }
    .quote small { display: block; margin-top: 0.5rem; font-size: 12px; color: var(--ink-muted); }
  </style>
</head>
<body>

<nav>
  <a href="/dashboard" class="nav-brand">Back <span>to Learn</span></a>
</nav>

<div class="page">
  <div class="auth-icon">📚</div>
  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-sub">Continue your learning journey</p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <div class="card">
    <form method="POST" action="/login">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Your username" required autocomplete="username" />
      </div>
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label>Password</label>
        <input type="password" name="password" placeholder="Your password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn">Log in →</button>
    </form>
  </div>

  <div class="footer-txt">
    New here? <a href="/register">Create an account</a>
  </div>

  <div class="quote">
    <p>"Education is the most powerful weapon which you can use to change the world."</p>
    <small>— Nelson Mandela</small>
  </div>
</div>

</body>
</html>
